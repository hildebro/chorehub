services:
  laneh-app:
    build:
      context: .
      target: builder
    user: "${UID:-1000}:${GID:-1000}"
    ports:
      - "${APP_PORT}:5173"
    env_file:
      - .env
    environment:
      PG_LITE_DATA_DIR: /data/pglite
      NODE_ENV: development
    volumes:
      - ./:/app
      - ${DATABASE_LOCATION}:/data/pglite
    networks:
      - laneh-network
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"

networks:
  laneh-network:
    driver: bridge
